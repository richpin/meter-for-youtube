<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        width: 380px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--plane);
        color: var(--text);
      }
      h1 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }

      /* Range filter — sits above everything it scopes, never inside the chart card */
      .ranges { display: flex; gap: 6px; margin-bottom: 12px; }
      .range-btn {
        flex: 1;
        padding: 5px 0;
        font-size: 12px;
        font-family: inherit;
        color: var(--text-2);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }
      .range-btn:hover { border-color: var(--muted); }
      .range-btn.active {
        color: var(--text);
        border-color: var(--usage);
        font-weight: 600;
      }

      /* Summary tiles — proportional figures, not tabular (these are standalone) */
      .summary { display: flex; gap: 8px; margin-bottom: 12px; }
      .tile {
        flex: 1;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
      }
      .tile .k { font-size: 11px; color: var(--text-2); margin-bottom: 2px; }
      .tile .v { font-size: 15px; font-weight: 600; }

      /* Chart card — the surface the palette was validated against */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
      }
      .legend { display: flex; gap: 14px; font-size: 12px; margin-bottom: 6px; }
      .legend .item { display: flex; align-items: center; gap: 5px; color: var(--text-2); }
      .swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; }
      .swatch.usage { background: var(--usage); }
      .swatch.watch { background: var(--watch); }

      #chart { width: 100%; display: block; overflow: visible; }
      #chart .grid-line { stroke: var(--grid); stroke-width: 1; }
      #chart .axis {
        fill: var(--muted);
        font-size: 9px;
        font-variant-numeric: tabular-nums; /* axis ticks do align vertically */
      }
      #chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      #chart .line.usage { stroke: var(--usage); }
      #chart .line.watch { stroke: var(--watch); }
      /* 2px surface ring so overlapping markers separate without a hard border */
      #chart .marker { stroke: var(--surface); stroke-width: 2; }
      #chart .marker.usage { fill: var(--usage); }
      #chart .marker.watch { fill: var(--watch); }
      .empty { color: var(--text-2); font-size: 12px; text-align: center; padding: 34px 0; }

      .limit { margin-top: 12px; }
      .limit-title { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
      .limit-toggle {
        width: 34px; height: 20px; padding: 2px; border: 0; border-radius: 10px;
        background: var(--muted); cursor: pointer; display: flex; align-items: center;
      }
      .limit-toggle[aria-checked="true"] { background: var(--usage); }
      .limit-toggle span {
        width: 16px; height: 16px; border-radius: 50%; background: #fff;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transform: translateX(0);
      }
      .limit-toggle[aria-checked="true"] span { transform: translateX(14px); }
      .limit-fields { display: flex; gap: 8px; margin-top: 10px; }
      .limit-fields label { flex: 1; display: grid; gap: 4px; font-size: 11px; color: var(--text-2); }
      .limit-fields select {
        width: 100%; padding: 6px 8px; border: 1px solid var(--border);
        border-radius: 5px; background: var(--plane); color: var(--text); font: inherit;
      }
      .limit-fields select:disabled { opacity: .5; }
      .limit-note { font-size: 11px; color: var(--text-2); line-height: 1.5; margin: 8px 0 0; }
      .limit-status { font-size: 11px; line-height: 1.5; margin: 4px 0 0; }
      .limit-status:empty { display: none; }
      button:disabled { opacity: .5; cursor: default; }
      :focus-visible { outline: 2px solid var(--usage); outline-offset: 2px; }

      /* Theme control */
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 12px;
      }
      .footer-label { font-size: 11px; color: var(--muted); }
      .themes { display: flex; gap: 4px; }
      .theme-btn {
        padding: 4px 9px;
        font-size: 11px;
        font-family: inherit;
        color: var(--text-2);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 5px;
        cursor: pointer;
      }
      .theme-btn:hover { border-color: var(--muted); }
      .theme-btn.active { color: var(--text); border-color: var(--usage); font-weight: 600; }
    </style>
  </head>
  <body>
    <h1 data-i18n="popupTitle"></h1>

    <div class="ranges" id="ranges">
      <button class="range-btn" data-days="7" data-i18n="range7"></button>
      <button class="range-btn active" data-days="30" data-i18n="range30"></button>
      <button class="range-btn" data-days="90" data-i18n="range90"></button>
    </div>

    <div class="summary">
      <div class="tile">
        <div class="k" data-i18n="todayUsage"></div>
        <div class="v" id="today-usage">--</div>
      </div>
      <div class="tile">
        <div class="k" data-i18n="todayWatch"></div>
        <div class="v" id="today-watch">--</div>
      </div>
      <div class="tile">
        <div class="k" data-i18n="avgUsage"></div>
        <div class="v" id="avg-usage">--</div>
      </div>
    </div>

    <div class="card">
      <div class="legend">
        <div class="item"><span class="swatch usage"></span><span data-i18n="usageLabel"></span></div>
        <div class="item"><span class="swatch watch"></span><span data-i18n="watchLabel"></span></div>
      </div>
      <div id="chart-wrap"></div>
    </div>

    <section class="card limit" aria-labelledby="limit-label">
      <div class="limit-title">
        <span id="limit-label" data-i18n="dailyLimit"></span>
        <button class="limit-toggle" id="limit-enabled" type="button" role="switch" aria-checked="false" aria-labelledby="limit-label" disabled><span aria-hidden="true"></span></button>
      </div>
      <div class="limit-fields">
        <label><span data-i18n="limitHours"></span><select id="limit-hours" disabled></select></label>
        <label><span data-i18n="limitMinutes"></span><select id="limit-minutes" disabled></select></label>
      </div>
      <p class="limit-note" data-i18n="limitNote"></p>
      <p class="limit-status" id="limit-status" role="status" aria-live="polite"></p>
    </section>

    <div class="footer">
      <span class="footer-label" data-i18n="themeLabel"></span>
      <div class="themes" id="themes">
        <button class="theme-btn" data-mode="auto" data-i18n="themeAuto"></button>
        <button class="theme-btn" data-mode="light" data-i18n="themeLight"></button>
        <button class="theme-btn" data-mode="dark" data-i18n="themeDark"></button>
      </div>
    </div>

    <script src="meter.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
